<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Today's Specials</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  background: #000;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: pan-y;
}

.stage img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.counter {
  position: fixed;
  top: 14px;
  right: 14px;
  color: white;
  background: rgba(0,0,0,.5);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 5;
}

.hint {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: rgba(0,0,0,.5);
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 14px;
  z-index: 5;
  white-space: nowrap;
}

.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  width: min(400px, 88vw);
  background: #111;
  color: #fff;
  z-index: 10;
  transform: translate(-50%, -50%) scale(.92);
  opacity: 0;
  pointer-events: none;
  transition: .2s ease;
  padding: 28px 26px;
  box-sizing: border-box;
  border-radius: 16px;
}

.panel.open {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.panel h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.price {
  color: #f2b134;
  font-weight: 600;
  margin-bottom: 18px;
}

.desc,
.allergens {
  color: #ddd;
  line-height: 1.5;
  font-size: 16px;
}

.allergens {
  margin-top: 16px;
}

.panel-close {
  float: right;
  border: none;
  background: rgba(255,255,255,.08);
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 9;
  opacity: 0;
  pointer-events: none;
}

.scrim.open {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<button class="stage" id="stage">
  <img id="special-image" src="special5.png" alt="Today's Specials">
</button>

<div class="counter" id="counter">1 / 4</div>
<div class="hint">Swipe left or right • Tap for details</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel">
  <button class="panel-close" id="panelClose">×</button>

  <h2 id="special-title"></h2>
  <p id="special-price" class="price"></p>
  <p id="special-desc" class="desc"></p>
  <p id="special-allergens" class="allergens"></p>
</aside>

<script>
const specials = [
  {
    title: "Fig & Ginger Mule",
    price: "12",
    image: "special5.png",
    description:
      "Black Infusions fig vodka, lime, ginger beer.",
    allergens: ""
  },
  {
    title: "Baked Oysters",
    price: "18",
    image: "special5.png",
    description:
      "Garlic herb butter, parmesan, crispy breadcrumbs, lemon.",
    allergens:
      "Shellfish, dairy, gluten"
  },
  {
    title: "Chilean Sea Bass",
    price: "42",
    image: "special5.png",
    description:
      "Brown butter miso, roasted delicata squash, broccolini.",
    allergens:
      "Fish, dairy"
  },
  {
    title: "Chocolate Peanut Butter Tart",
    price: "12",
    image: "special5.png",
    description:
      "Dark chocolate ganache, peanut butter mousse, peanut brittle crunch, sea salt.",
    allergens:
      "Dairy, peanuts, gluten, egg"
  }
];

let current = 0;

const stage = document.getElementById("stage");
const image = document.getElementById("special-image");
const counter = document.getElementById("counter");

const panel = document.getElementById("panel");
const scrim = document.getElementById("scrim");
const panelClose = document.getElementById("panelClose");

const title = document.getElementById("special-title");
const price = document.getElementById("special-price");
const desc = document.getElementById("special-desc");
const allergens = document.getElementById("special-allergens");

function renderSpecial() {
  const s = specials[current];

  image.src = s.image;
  image.alt = s.title;

  title.textContent = s.title;
  price.textContent = "$" + s.price;
  desc.textContent = s.description;

  allergens.textContent =
    s.allergens ? "Allergens: " + s.allergens : "";

  counter.textContent =
    `${current + 1} / ${specials.length}`;
}

function nextSpecial() {
  current = (current + 1) % specials.length;
  renderSpecial();
}

function previousSpecial() {
  current =
    (current - 1 + specials.length) % specials.length;

  renderSpecial();
}

function openPanel() {
  renderSpecial();
  panel.classList.add("open");
  scrim.classList.add("open");
}

function closePanel() {
  panel.classList.remove("open");
  scrim.classList.remove("open");
}

let startX = 0;
let startY = 0;
let swiped = false;

stage.addEventListener("touchstart", function(e) {
  const touch = e.changedTouches[0];

  startX = touch.clientX;
  startY = touch.clientY;
  swiped = false;
}, { passive: true });

stage.addEventListener("touchend", function(e) {
  const touch = e.changedTouches[0];

  const diffX = touch.clientX - startX;
  const diffY = touch.clientY - startY;

  if (
    Math.abs(diffX) > 50 &&
    Math.abs(diffX) > Math.abs(diffY)
  ) {
    swiped = true;

    if (diffX < 0) {
      nextSpecial();
    } else {
      previousSpecial();
    }
  }
}, { passive: true });

stage.addEventListener("click", function() {
  if (swiped) {
    swiped = false;
    return;
  }

  openPanel();
});

panelClose.addEventListener("click", closePanel);
scrim.addEventListener("click", closePanel);

document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight") {
    nextSpecial();
  }

  if (e.key === "ArrowLeft") {
    previousSpecial();
  }

  if (e.key === "Escape") {
    closePanel();
  }
});

renderSpecial();
</script>

</body>
</html>
