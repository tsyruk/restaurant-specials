<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Today's Specials</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  background: #000;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: pan-y;
}

.stage img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.hint {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  background: rgba(0,0,0,.45);
  padding: 6px 10px;
  border-radius: 999px;
  opacity: .85;
  z-index: 5;
  pointer-events: none;
  white-space: nowrap;
}

.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  width: min(400px, 88vw);
  background: #111;
  color: #fff;
  z-index: 10;
  transform: translate(-50%, -50%) scale(.92);
  opacity: 0;
  pointer-events: none;
  transition: transform .2s ease, opacity .2s ease;
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
  display: flex;
  flex-direction: column;
  padding: 28px 26px;
  box-sizing: border-box;
  border-radius: 16px;
}

.panel.open {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.panel h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.panel .price {
  margin: 0 0 18px;
  font-size: 17px;
  color: #f2b134;
  font-weight: 600;
}

.panel .desc,
.panel .allergens {
  font-size: 16px;
  line-height: 1.55;
  color: #ddd;
}

.panel .allergens {
  margin-top: 16px;
}

.panel-close {
  align-self: flex-end;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 9;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}

.scrim.open {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<button class="stage" id="stage">
  <img src="special5.png" alt="Today's Specials">
</button>

<div class="hint">Tap for today's specials</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel">

  <button class="panel-close" id="panelClose">×</button>

  <h2 id="special-title"></h2>

  <p id="special-price" class="price"></p>

  <p id="special-desc" class="desc"></p>

  <p id="special-allergens" class="allergens"></p>

</aside>

<script>

const specials = [
  {
    title: "Fig & Ginger Mule",
    price: "12",
    description:
      "Black Infusions fig vodka, lime, ginger beer.",
    allergens: ""
  },

  {
    title: "Baked Oysters",
    price: "18",
    description:
      "Garlic herb butter, parmesan, crispy breadcrumbs, lemon.",
    allergens:
      "Shellfish, dairy, gluten"
  },

  {
    title: "Chilean Sea Bass",
    price: "42",
    description:
      "Brown butter miso, roasted delicata squash, broccolini.",
    allergens:
      "Fish, dairy"
  },

  {
    title: "Chocolate Peanut Butter Tart",
    price: "12",
    description:
      "Dark chocolate ganache, peanut butter mousse, peanut brittle crunch, sea salt.",
    allergens:
      "Dairy, peanuts, gluten, egg"
  }
];

let current = 0;

const stage = document.getElementById("stage");
const panel = document.getElementById("panel");
const scrim = document.getElementById("scrim");

const title = document.getElementById("special-title");
const price = document.getElementById("special-price");
const desc = document.getElementById("special-desc");
const allergens = document.getElementById("special-allergens");

const panelClose = document.getElementById("panelClose");

function renderSpecial() {

  const s = specials[current];

  title.textContent = s.title;

  price.textContent = "$" + s.price;

  desc.textContent = s.description;

  allergens.textContent =
    s.allergens ? "Allergens: " + s.allergens : "";
}

function openPanel() {

  renderSpecial();

  panel.classList.add("open");
  scrim.classList.add("open");
}

function closePanel() {

  panel.classList.remove("open");
  scrim.classList.remove("open");
}

stage.addEventListener("click", openPanel);

scrim.addEventListener("click", closePanel);

panelClose.addEventListener("click", closePanel);

document.addEventListener("keydown", (e) => {

  if (e.key === "Escape") {
    closePanel();
  }

});

setTimeout(() => {
  document.querySelector(".hint")?.remove();
}, 6000);

</script>

</body>
</html>
