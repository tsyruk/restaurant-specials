<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's Specials</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#viewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #000;
  touch-action: none;
}

#viewer img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

#details {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  width: min(90%, 500px);
  background: rgba(0,0,0,.78);
  color: white;
  padding: 18px 20px;
  border-radius: 14px;
  box-sizing: border-box;
  z-index: 10;
}

#details h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

#price {
  margin: 0 0 12px;
  font-size: 18px;
  font-weight: bold;
  color: #f2b134;
}

#description {
  margin: 0;
  font-size: 16px;
  line-height: 1.45;
}

#allergens {
  margin: 12px 0 0;
  font-size: 14px;
  line-height: 1.4;
  color: #ddd;
}

#counter {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 20;
  color: white;
  background: rgba(0,0,0,.6);
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 14px;
}

.arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  border: none;
  background: rgba(0,0,0,.5);
  color: white;
  width: 48px;
  height: 64px;
  font-size: 36px;
  border-radius: 8px;
  cursor: pointer;
}

#prev {
  left: 10px;
}

#next {
  right: 10px;
}
</style>
</head>

<body>

<div id="viewer">
  <img src="special5.png" alt="Today's Specials">
</div>

<button class="arrow" id="prev">‹</button>
<button class="arrow" id="next">›</button>

<div id="counter">1 / 4</div>

<div id="details">
  <h2 id="title"></h2>
  <p id="price"></p>
  <p id="description"></p>
  <p id="allergens"></p>
</div>

<script>
const specials = [
  {
    title: "Fig & Ginger Mule",
    price: "$12",
    description:
      "Black Infusions fig vodka, lime, ginger beer.",
    allergens: ""
  },
  {
    title: "Baked Oysters",
    price: "$18",
    description:
      "Garlic herb butter, parmesan, crispy breadcrumbs, lemon.",
    allergens:
      "Allergens: Shellfish, dairy, gluten"
  },
  {
    title: "Chilean Sea Bass",
    price: "$42",
    description:
      "Brown butter miso, roasted delicata squash, broccolini.",
    allergens:
      "Allergens: Fish, dairy"
  },
  {
    title: "Chocolate Peanut Butter Tart",
    price: "$12",
    description:
      "Dark chocolate ganache, peanut butter mousse, peanut brittle crunch, sea salt.",
    allergens:
      "Allergens: Dairy, peanuts, gluten, egg"
  }
];

let current = 0;

const title = document.getElementById("title");
const price = document.getElementById("price");
const description = document.getElementById("description");
const allergens = document.getElementById("allergens");
const counter = document.getElementById("counter");

function showPage() {
  const special = specials[current];

  title.textContent = special.title;
  price.textContent = special.price;
  description.textContent = special.description;
  allergens.textContent = special.allergens;

  counter.textContent =
    (current + 1) + " / " + specials.length;
}

function nextPage() {
  current = (current + 1) % specials.length;
  showPage();
}

function previousPage() {
  current =
    (current - 1 + specials.length) % specials.length;

  showPage();
}

document
  .getElementById("next")
  .addEventListener("click", nextPage);

document
  .getElementById("prev")
  .addEventListener("click", previousPage);


/* SWIPE */

let startX = 0;
let startY = 0;

const viewer = document.getElementById("viewer");

viewer.addEventListener("touchstart", function(e) {
  startX = e.changedTouches[0].clientX;
  startY = e.changedTouches[0].clientY;
}, { passive: true });

viewer.addEventListener("touchend", function(e) {

  const endX = e.changedTouches[0].clientX;
  const endY = e.changedTouches[0].clientY;

  const diffX = endX - startX;
  const diffY = endY - startY;

  if (
    Math.abs(diffX) > 40 &&
    Math.abs(diffX) > Math.abs(diffY)
  ) {

    if (diffX < 0) {
      nextPage();
    } else {
      previousPage();
    }

  }

}, { passive: true });


/* COMPUTER ARROW KEYS */

document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowRight") {
    nextPage();
  }

  if (e.key === "ArrowLeft") {
    previousPage();
  }

});

showPage();
</script>

</body>
</html>
