<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Today's Specials</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* SWIPE CONTAINER */
    .viewer {
      width: 100vw;
      height: 100vh;

      display: flex;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: none;
    }

    .viewer::-webkit-scrollbar {
      display: none;
    }

    /* EACH SPECIAL = ONE FULL SCREEN PAGE */
    .slide {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100vh;

      scroll-snap-align: start;
      scroll-snap-stop: always;

      position: relative;

      background: #000;
    }

    /* TAP AREA */
    .special-button {
      width: 100%;
      height: 100%;

      padding: 0;
      margin: 0;

      border: 0;
      background: #000;

      display: block;

      cursor: pointer;
    }

    .special-button img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;
    }

    /* On bigger screens don't crop the image as much */
    @media (min-width: 700px) {
      .special-button img {
        object-fit: contain;
      }
    }

    /* BOTTOM HELP TEXT */
    .hint {
      position: fixed;

      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      color: white;
      background: rgba(0, 0, 0, 0.55);

      padding: 8px 14px;

      border-radius: 999px;

      font-size: 14px;

      white-space: nowrap;

      pointer-events: none;
    }

    /* DARK BACKGROUND BEHIND DESCRIPTION */
    .scrim {
      position: fixed;
      inset: 0;

      z-index: 30;

      background: rgba(0, 0, 0, 0.55);

      opacity: 0;

      pointer-events: none;

      transition: opacity 0.2s ease;
    }

    .scrim.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* DESCRIPTION POPUP */
    .panel {
      position: fixed;

      top: 50%;
      left: 50%;

      width: min(420px, 88vw);

      transform: translate(-50%, -50%) scale(0.92);

      z-index: 40;

      background: #111;
      color: white;

      padding: 26px;

      border-radius: 18px;

      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.7);

      opacity: 0;

      pointer-events: none;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease;
    }

    .panel.open {
      opacity: 1;

      pointer-events: auto;

      transform: translate(-50%, -50%) scale(1);
    }

    .panel-close {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 36px;
      height: 36px;

      border: 0;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.1);

      color: white;

      font-size: 22px;

      cursor: pointer;
    }

    .panel h2 {
      margin: 0 40px 6px 0;

      font-size: 25px;
    }

    .price {
      margin: 0 0 18px;

      color: #f2b134;

      font-size: 18px;

      font-weight: 700;
    }

    .desc {
      margin: 0;

      color: #ddd;

      font-size: 16px;

      line-height: 1.55;
    }

    /* PAGE DOTS */
    .dots {
      position: fixed;

      top: max(18px, env(safe-area-inset-top));
      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      display: flex;

      gap: 8px;

      pointer-events: none;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.45);

      transition: all 0.2s ease;
    }

    .dot.active {
      width: 22px;

      border-radius: 10px;

      background: white;
    }
  </style>
</head>

<body>

  <main class="viewer" id="viewer">

    <!-- ==========================
         SPECIAL #1
         ========================== -->

    <section class="slide">

      <button
        class="special-button"
        type="button"
        data-title="Pan-Fried Skate Wing"
        data-price="$40"
      data-description="It's a mild, flaky skate wing that's pan-fried and served over creamy lobster risotto with a roasted tomato vinaigrette. It's finished with grilled zucchini, shaved fennel, and fresh dill. The fish is very delicate and isn't fishy—it's one of our lighter seafood options."
        aria-label="Open details for Special 1"
      >

        <img
          src="special1.jpg"
          alt="Special #1"
        >

      </button>

    </section>


    <!-- ==========================
         SPECIAL #2
         ========================== -->

    <section class="slide">

      <button
        class="special-button"
        type="button"
        data-title="Lavender Blueberry Panna Cotta"
        data-price="$12"
        data-description="It's a creamy lavender panna cotta topped with a sweet blueberry compote. It's served with a brown butter pistachio shortbread crumble for crunch and finished with fresh whipped cream. It's light, creamy, and not overly sweet."
        aria-label="Open details for Special 2"
      >

        <img
          src="special2.jpg"
          alt="Special #2"
        >

      </button>

    </section>

  </main>


  <!-- PAGE INDICATORS -->
  <div class="dots" aria-hidden="true">

    <div class="dot active"></div>
    <div class="dot"></div>

  </div>


  <!-- INSTRUCTIONS -->
  <div class="hint" id="hint">
    Tap for details • Swipe for next special
  </div>


  <!-- DARK BACKGROUND -->
  <div
    class="scrim"
    id="scrim"
  ></div>


  <!-- DESCRIPTION PANEL -->
  <aside
    class="panel"
    id="panel"
    aria-hidden="true"
    aria-label="Dish details"
  >

    <button
      class="panel-close"
      id="panelClose"
      type="button"
      aria-label="Close details"
    >
      ×
    </button>

    <h2 id="specialTitle"></h2>

    <p
      class="price"
      id="specialPrice"
    ></p>

    <p
      class="desc"
      id="specialDescription"
    ></p>

  </aside>


  <script>

    const viewer = document.getElementById("viewer");

    const buttons =
      document.querySelectorAll(".special-button");

    const panel =
      document.getElementById("panel");

    const scrim =
      document.getElementById("scrim");

    const panelClose =
      document.getElementById("panelClose");

    const title =
      document.getElementById("specialTitle");

    const price =
      document.getElementById("specialPrice");

    const description =
      document.getElementById("specialDescription");

    const dots =
      document.querySelectorAll(".dot");


    /* --------------------------
       OPEN DESCRIPTION
       -------------------------- */

    buttons.forEach(button => {

      button.addEventListener("click", () => {

        title.textContent =
          button.dataset.title;

        price.textContent =
          button.dataset.price;

        description.textContent =
          button.dataset.description;

        panel.classList.add("open");

        scrim.classList.add("open");

        panel.setAttribute(
          "aria-hidden",
          "false"
        );

      });

    });


    /* --------------------------
       CLOSE DESCRIPTION
       -------------------------- */

    function closePanel() {

      panel.classList.remove("open");

      scrim.classList.remove("open");

      panel.setAttribute(
        "aria-hidden",
        "true"
      );

    }

    panelClose.addEventListener(
      "click",
      closePanel
    );

    scrim.addEventListener(
      "click",
      closePanel
    );


    /* --------------------------
       UPDATE DOT WHEN SWIPING
       -------------------------- */

    viewer.addEventListener("scroll", () => {

      const page =
        Math.round(
          viewer.scrollLeft /
          viewer.clientWidth
        );

      dots.forEach(
        (dot, index) => {

          dot.classList.toggle(
            "active",
            index === page
          );

        }
      );

    });


    /* --------------------------
       HIDE INSTRUCTIONS
       -------------------------- */

    setTimeout(() => {

      document
        .getElementById("hint")
        ?.remove();

    }, 6000);

  </script>

</body>
</html>
