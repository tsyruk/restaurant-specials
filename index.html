<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Today's Specials</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
}

.stage {
  position: fixed;
  inset: 0;
  background: #000;
  border: none;
  padding: 0;
  cursor: pointer;
  touch-action: pan-y;
}

.stage img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

.hint {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  background: rgba(0,0,0,.45);
  padding: 6px 10px;
  border-radius: 999px;
  opacity: .85;
  z-index: 5;
  pointer-events: none;
  white-space: nowrap;
}

.counter {
  position: fixed;
  top: 14px;
  right: 14px;
  color: white;
  font-size: 13px;
  background: rgba(0,0,0,.45);
  padding: 6px 10px;
  border-radius: 999px;
  z-index: 5;
  pointer-events: none;
}

.panel {
  position: fixed;
  top: 50%;
  left: 50%;
  width: min(400px, 88vw);
  background: #111;
  color: #fff;
  z-index: 10;
  transform: translate(-50%, -50%) scale(.92);
  opacity: 0;
  pointer-events: none;
  transition: transform .2s ease, opacity .2s ease;
  box-shadow: 0 12px 40px rgba(0,0,0,.6);
  display: flex;
  flex-direction: column;
  padding: 28px 26px;
  box-sizing: border-box;
  border-radius: 16px;
}

.panel.open {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  pointer-events: auto;
}

.panel h2 {
  margin: 0 0 6px;
  font-size: 24px;
}

.panel .price {
  margin: 0 0 18px;
  font-size: 17px;
  color: #f2b134;
  font-weight: 600;
}

.panel .desc {
  margin: 0;
  font-size: 16px;
  line-height: 1.55;
  color: #ddd;
}

.panel-close {
  align-self: flex-end;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  border: none;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  margin-bottom: 8px;
}

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 9;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}

.scrim.open {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<button class="stage" id="stage" aria-label="Show dish details">
  <img id="special-image" src="special1.jpg" alt="Crab Cocktail">
</button>

<div class="counter" id="counter">1 / 3</div>
<div class="hint">Swipe for more specials • Tap for details</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel">
  <button class="panel-close" id="panelClose" aria-label="Close details">×</button>
  <h2 id="special-title"></h2>
  <p id="special-price" class="price"></p>
  <p id="special-desc" class="desc"></p>
</aside>

<script>
const specials = [
  {
    title: "Crab Cocktail",
    price: "24",
    image: "special1.jpg",
    description:
      "Colossal lump crab, green tomato jam, pickled mustard seed, shaved fennel, crispy shallots, grilled sourdough."
  },
  {
    title: "Grilled Bone In Pork Chop",
    price: "34",
    image: "special2.jpg",
    description:
      "Charred romano beans, grilled kale, red currant glaze, pickled apples, sage butter crumbs."
  },
  {
    title: "Chocolate Peanut Butter Tart",
    price: "12",
    image: "special3.jpg",
    description:
      "Dark chocolate ganache, peanut butter mousse, peanut brittle crunch, sea salt."
  }
];

let current = 0;

const stage = document.getElementById("stage");
const image = document.getElementById("special-image");
const title = document.getElementById("special-title");
const price = document.getElementById("special-price");
const desc = document.getElementById("special-desc");
const counter = document.getElementById("counter");
const panel = document.getElementById("panel");
const scrim = document.getElementById("scrim");
const panelClose = document.getElementById("panelClose");

function renderSpecial() {
  const s = specials[current];

  image.src = s.image;
  image.alt = s.title;

  title.textContent = s.title;
  price.textContent = "$" + s.price;
  desc.textContent = s.description;

  counter.textContent = `${current + 1} / ${specials.length}`;
}

function nextSpecial() {
  current = (current + 1) % specials.length;
  renderSpecial();
}

function previousSpecial() {
  current = (current - 1 + specials.length) % specials.length;
  renderSpecial();
}

function openPanel() {
  panel.classList.add("open");
  scrim.classList.add("open");
}

function closePanel() {
  panel.classList.remove("open");
  scrim.classList.remove("open");
}

let touchStartX = 0;
let touchStartY = 0;
let touchMoved = false;

stage.addEventListener("touchstart", (e) => {
  const touch = e.changedTouches[0];

  touchStartX = touch.screenX;
  touchStartY = touch.screenY;
  touchMoved = false;
}, { passive: true });

stage.addEventListener("touchend", (e) => {
  const touch = e.changedTouches[0];

  const dx = touch.screenX - touchStartX;
  const dy = touch.screenY - touchStartY;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
    touchMoved = true;

    if (dx < 0) {
      nextSpecial();
    } else {
      previousSpecial();
    }
  }
}, { passive: true });

stage.addEventListener("click", () => {
  if (touchMoved) {
    touchMoved = false;
    return;
  }

  openPanel();
});

scrim.addEventListener("click", closePanel);
panelClose.addEventListener("click", closePanel);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextSpecial();
  if (e.key === "ArrowLeft") previousSpecial();
  if (e.key === "Escape") closePanel();
});

renderSpecial();

setTimeout(() => {
  document.querySelector(".hint")?.remove();
}, 6000);
</script>

</body>
</html>
